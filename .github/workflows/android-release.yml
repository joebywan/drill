name: Android release

# Builds, signs and checks the release APK and bundle, then publishes them as a GitHub release (Publish to Google Play takes the bundle from there). Run by hand
# until the Drill key exists: it fails at the first step while the secrets are missing.
on:
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check the signing secrets
        working-directory: .
        env:
          KEYSTORE_BASE64: ${{ secrets.DRILL_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DRILL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DRILL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DRILL_KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing DRILL_$name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing. Refusing to build a release (see CLAUDE.md, Android)."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        working-directory: .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.DRILL_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks" || { echo "::error::decoded keystore is empty"; exit 1; }

      # assembleRelease only, never a debug build; the bundle is what Play takes, in the same step with the same key. -PrequireSigning turns "no key, so quietly emit
      # app-release-unsigned.apk" into a failure.
      - name: Build signed release
        env:
          DRILL_KEYSTORE: ${{ runner.temp }}/release.jks
          DRILL_KEYSTORE_PASSWORD: ${{ secrets.DRILL_KEYSTORE_PASSWORD }}
          DRILL_KEY_ALIAS: ${{ secrets.DRILL_KEY_ALIAS }}
          DRILL_KEY_PASSWORD: ${{ secrets.DRILL_KEY_PASSWORD }}
          DRILL_VERSION_CODE: ${{ github.run_number }}
          DRILL_VERSION_NAME: 0.1.${{ github.run_number }}
        run: ./gradlew assembleRelease bundleRelease -PrequireSigning=true

      # Fails an unsigned, wrong-key or debuggable APK, and an unsigned or wrong-key bundle.
      - name: Verify the APK and the bundle
        run: |
          ./tools/verify-apk.sh app/build/outputs/apk/release/app-release.apk
          ./tools/verify-aab.sh app/build/outputs/bundle/release/app-release.aab

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "drill-0.1.${{ github.run_number }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "drill-0.1.${{ github.run_number }}.aab"
          gh release create "android-v0.1.${{ github.run_number }}" "drill-0.1.${{ github.run_number }}.apk" "drill-0.1.${{ github.run_number }}.aab" \
            --title "Drill for Android 0.1.${{ github.run_number }}" --generate-notes

      - name: Clean up the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
