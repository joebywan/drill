name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - run: npm ci
      - run: npm test
      # The sync worker (server/): its API tests, and the local worker sync.spec.js runs against.
      - run: npm ci --prefix server
      - run: npm test --prefix server
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
