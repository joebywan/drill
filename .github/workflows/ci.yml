name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - run: npm ci
      - run: npm test
      # The sync worker (server/) is only tested while sync is on (SYNC in src/sync/config.js); sync.spec.js
      # skips the same way. Its dependencies come from the root npm ci (postinstall).
      - id: flag
        run: node --input-type=module -e "import { SYNC } from './src/sync/config.js'; console.log('sync=' + SYNC)" >> "$GITHUB_OUTPUT"
      - if: steps.flag.outputs.sync == 'true'
        run: npm test --prefix server
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
