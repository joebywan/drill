name: Android

# The WebView wrapper in android/. Separate from the web CI: it only runs when the wrapper changes.
on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      # The APK's assets are the repo's web app plus the three libraries the import map points at.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        working-directory: .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # The variant that ships, built unsigned (PR secrets are not available), so a broken release
      # build cannot hide behind a green debug one.
      - name: Build release variant
        run: ./gradlew assembleRelease

      - name: No INTERNET permission
        run: |
          AAPT2="$(ls -1 "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk; do
            if "$AAPT2" dump permissions "$apk" | grep -q "android.permission.INTERNET"; then
              echo "::error::$apk asks for INTERNET; the wrapper must stay offline"; exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: drill-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
